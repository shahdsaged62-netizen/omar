
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love You ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080006;
  overflow: hidden;
  width: 100%;
  height: 100vh;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>
<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let W, H, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

// كلمات بحبك بلغات مختلفة
const words = [
  "I LOVE YOU", "بحبك", "Je t'aime",
  "Te amo", "Ti amo", "愛してる",
  "사랑해", "Ich liebe dich", "Я тебя люблю",
  "أحبك", "Love", "Amore",
  "Mon amour", "Seni seviyorum", "Eu te amo",
  "احبك", "Te quiero", "Люблю тебя"
];

// نقاط القلب
function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = -(13 * Math.cos(t)
    - 5 * Math.cos(2*t)
    - 2 * Math.cos(3*t)
    - Math.cos(4*t));

  return { x, y };
}

// قلوب الخلفية المتحركة
let floatingHearts = [];

for (let i = 0; i < 45; i++) {
  floatingHearts.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: 5 + Math.random() * 13,
    speed: 0.3 + Math.random() * 1.1,
    drift: Math.random() * 1.2 - 0.6,
    alpha: 0.2 + Math.random() * 0.6
  });
}

function drawFloatingHearts() {
  floatingHearts.forEach(h => {
    h.y -= h.speed;
    h.x += Math.sin(h.y * 0.012) * h.drift;

    if (h.y < -30) {
      h.y = H + 20;
      h.x = Math.random() * W;
    }

    ctx.save();
    ctx.globalAlpha = h.alpha;
    ctx.font = '${h.size}px Arial';
    ctx.fillStyle = "#ff5b91";
    ctx.shadowColor = "#ff1765";
    ctx.shadowBlur = 15;
    ctx.fillText("♥️", h.x, h.y);
    ctx.restore();
  });
}

// رسم الكلمات على شكل قلب
function drawHeartWords(time) {
  const centerX = W / 2;
  const centerY = H / 2 - 5;

  const scale = Math.min(W / 39, H / 34, 19);

  const pulse = 1 + Math.sin(time * 0.0025) * 0.025;

  const total = 110;

  for (let i = 0; i < total; i++) {
    const t = (i / total) * Math.PI * 2;
    const p = heartPoint(t);

    const x = centerX + p.x * scale * pulse;
    const y = centerY + p.y * scale * pulse;

    const next = heartPoint(t + 0.01);

    const angle = Math.atan2(
      (next.y - p.y),
      (next.x - p.x)
    );

    const delay = i * 0.045;
    const progress = Math.min(1, Math.max(0, (time / 1000 - delay) * 1.7));

    if (progress <= 0) continue;

    const word = words[i % words.length];
    const fontSize = Math.max(13, Math.min(22, W / 34));

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    ctx.globalAlpha = progress;

    ctx.font = 'bold ${fontSize}px Arial, sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.shadowColor = "#ff174d";
    ctx.shadowBlur = 18;

    const gradient = ctx.createLinearGradient(
      0, -fontSize, 0, fontSize
    );

    gradient.addColorStop(0, "#fff4f7");
    gradient.addColorStop(0.4, "#ff7b9f");
    gradient.addColorStop(1, "#d90042");

    ctx.fillStyle = gradient;
    ctx.fillText(word, 0, 0);

    ctx.restore();
  }
}

// الكتابة في المنتصف
function drawCenter(time) {
  const pulse = 1 + Math.sin(time * 0.003) * 0.07;

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(pulse, pulse);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.font = "bold 30px Arial";
  ctx.fillStyle = "#fff0f5";
  ctx.shadowColor = "#ff174d";
  ctx.shadowBlur = 25;

  ctx.fillText("LOVE YOU", 0, -12);

  ctx.font = "bold 32px Arial";
  ctx.fillStyle = "#ff4f83";
  ctx.fillText("♥️", 0, 28);

  ctx.restore();
}

// حلقة الحركة
function animate(time) {
  ctx.clearRect(0, 0, W, H);

  // خلفية سوداء
  ctx.fillStyle = "#080006";
  ctx.fillRect(0, 0, W, H);

  drawFloatingHearts();
  drawHeartWords(time);
  drawCenter(time);

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>

</body>
</html>
